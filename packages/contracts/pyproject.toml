[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepulse-contracts"
version = "0.1.0"
description = "Shared TradePulse API and domain contracts (error, health)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tradepulse_contracts*"]
